apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: kiosks
spec:
  selector:
    matchLabels:
      type: kiosk
  template:
    metadata:
      labels:
        demo-revision: "13"
    spec:
      os:
        image: quay.io/flightctl/flightctl-device:base-fedora-bootc-v1.4.0-main-86-g9a4353536
      applications:
        - name: kiosk-app
          appType: compose
          inline:
            - path: podman-compose.yaml
              content: |-
                version: "3.8"
                services:
                  kiosk:
                    image: docker.io/library/python:3.11-slim
                    working_dir: /app
                    command: ["python", "-m", "http.server", "8080"]
                    volumes:
                      - /var/kiosk/catalog:/app:ro,z
                    ports:
                      - "8080:8080"
          envVars: {}
      config:
        - name: kiosk-screen-lock
          inline:
            - path: /etc/kiosk-mode/bin/disable-screen-lock.sh
              content: |-
                #!/bin/bash
                set -euo pipefail
                export PATH=/usr/sbin:/usr/bin:/sbin:/bin
                # The Fedora demo image logs into Xfce as user.
                # Other desktop images do not use these settings.
                command -v xfconf-query >/dev/null || exit 0
                if [ "$(id -u)" -eq 0 ]; then
                  kiosk_uid=$(id -u user)
                  # Autostart applies the settings if no session exists yet.
                  [ -S "/run/user/$kiosk_uid/bus" ] || exit 0
                  exec runuser -u user -- env \
                    DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$kiosk_uid/bus" \
                    /usr/bin/bash "$0"
                fi
                xfconf-query -c xfce4-screensaver -p /lock/enabled --create -t bool -s false
                xfconf-query -c xfce4-screensaver -p /saver/enabled --create -t bool -s false
                xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/lock-screen-suspend-hibernate --create -t bool -s false
                # Uncover the kiosk if the current session is already locked.
                xfce4-screensaver-command --exit || true
            - path: /etc/xdg/autostart/flightctl-disable-screen-lock.desktop
              content: |-
                [Desktop Entry]
                Type=Application
                Name=Disable kiosk screen lock
                Exec=/usr/bin/bash /etc/kiosk-mode/bin/disable-screen-lock.sh
                OnlyShowIn=XFCE;
                X-GNOME-Autostart-enabled=true
            - path: /etc/flightctl/hooks.d/afterupdating/10-disable-screen-lock.yaml
              content: |-
                - run: /usr/bin/bash /etc/kiosk-mode/bin/disable-screen-lock.sh
                  timeout: 10s
        - name: kiosk-url
          inline:
            - path: /etc/kiosk-mode/bin/url.conf
              content: http://localhost:8080
        - name: kiosk-content
          gitRef:
            repository: kiosk-content
            targetRevision: v1
            path: /{{ .metadata.labels.region }}
        - name: gnome-kiosk-script
          gitRef:
            repository: flightctl-demos
            targetRevision: fc-kiosk
            path: /kiosk/kiosk-script
